envoy.PACIFISTIC.war=War? We grieve. We still hope for peace.
envoy.PACIFISTIC.peace=Peace! Our people rejoice.
envoy.PACIFISTIC.treaty=Gladly. Let it bring our peoples closer.
envoy.PACIFISTIC.broken=This saddens us deeply. Our door stays open.
envoy.PACIFISTIC.tribute=If it keeps the peace, take it.
envoy.PACIFISTIC.exchange=Knowledge shared is knowledge doubled.
