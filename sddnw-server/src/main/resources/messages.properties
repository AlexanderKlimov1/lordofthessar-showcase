envoy.XENOPHOBIC.refusal=We want nothing from outsiders.
envoy.HONORABLE.war=You have chosen war. We will meet you with honour.
envoy.HONORABLE.peace=We accept peace gladly, and will keep it.
envoy.HONORABLE.treaty=Our word is given. May yours be as firm.
envoy.HONORABLE.broken=A treaty broken is a stain that does not wash off.
envoy.HONORABLE.tribute=We pay what is asked, and remember it with dignity.
envoy.HONORABLE.exchange=An honest exchange between honest peoples.
envoy.HONORABLE.gift=Your generosity honours us.
