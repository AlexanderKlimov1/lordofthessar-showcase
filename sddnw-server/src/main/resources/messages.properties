# Справочник «Как устроено» — field-backlog, пункты 75 и 200 (RulesBookService).
rules.phase.PopulationPhase.title=Population growth
rules.phase.PopulationPhase.text=Colonies grow by their free room and food, or starve; housing adds people.
rules.phase.TransferPhase.title=Transfers land
rules.phase.TransferPhase.text=Colonists carried between systems land at their new colony.
rules.phase.ProductionPhase.title=Production and income
rules.phase.ProductionPhase.text=Colonies finish buildings and ships, the next item of the queue starts, taxes and upkeep are paid. A ship built now is already in its fleet this turn, so it can meet the enemy in the same turn.
rules.phase.AiEmpirePhase.title=Decisions of rivals
rules.phase.AiEmpirePhase.text=Computer empires — and the empires of absent players — choose builds, send fleets and agents.
rules.phase.LeaderPhase.title=Leaders
rules.phase.LeaderPhase.text=Leaders offer their service, gain experience and are paid.
rules.phase.ResearchPhase.title=Research
rules.phase.ResearchPhase.text=Research points are added and a breakthrough is checked. Research comes after production: a technology found now serves production from the next turn.
rules.phase.AssimilationPhase.title=Assimilation
rules.phase.AssimilationPhase.text=Subjects of a conquered colony slowly become your own people.
rules.phase.EspionagePhase.title=Espionage
rules.phase.EspionagePhase.text=Agents carry out their missions; counter-intelligence catches spies.
rules.phase.ArrivalPhase.title=Fleets arrive
rules.phase.ArrivalPhase.text=Fleets reach their stars and explore systems, meet mines and monsters; colony ships are ready to land.
rules.phase.EncounterPhase.title=Encounters and battles
rules.phase.EncounterPhase.text=Fleets at the same star meet, and battles are fought — automatically or on the tactical field.
rules.phase.ContactPhase.title=Contact
rules.phase.ContactPhase.text=Empires that can reach each other meet; contact pauses when neither can reach the other.
rules.phase.GalacticEventsPhase.title=Galactic events
rules.phase.GalacticEventsPhase.text=Random events — finds, accidents, pirates — if they are on in this game.
rules.phase.AiDiplomacyPhase.title=Diplomacy of rivals
rules.phase.AiDiplomacyPhase.text=Proposals to people are settled by their answers (or by trust, if unanswered); then computer empires declare war, ask for peace, offer treaties and demand tribute.
rules.phase.ArtifactChoicePhase.title=Legacy of the vanished
rules.phase.ArtifactChoicePhase.text=A legacy you did not choose by the end of the following turn gives its first technologies
rules.phase.EmpireHistoryPhase.title=Annals
rules.phase.EmpireHistoryPhase.text=Population, fleet, production and research of every empire are recorded for the Info charts.
rules.phase.VictoryPhase.title=End of the game
rules.phase.VictoryPhase.text=Paths to victory are checked: conquest, the Council, Thessar, might.
rules.phase.IntelPhase.title=Memory of foreign colonies
rules.phase.IntelPhase.text=What your eyes see now is remembered: without them a foreign colony stays as you last saw it.
rules.phase.ChapterPhase.title=Chapters of the game
rules.phase.ChapterPhase.text=The game is split into chapters by its state, not by the turn number: expansion, first neighbours, first war, the struggle for the Council and the finale. A new chapter is named in the turn summary.
rules.article.victory.title=Paths to victory
rules.article.victory.text=There are four. Conquest: only you still hold colonies. The Galactic Council: a candidate needs {0} % of all votes. Holding Thessar: one empire alone holds a colony at the special star for {1} turns in a row. Verdict of might: if nothing else has ended the game by turn {2}, the strongest living empire wins. Which paths are on is chosen when the game is created.
rules.article.victory.deviation=Holding Thessar and the verdict of might are paths of this game: they give a long game a finish line.
rules.article.council.title=The Galactic Council
rules.article.council.text=The Council meets no earlier than turn {0} and then every {1} turns, while at least {2} empires are alive. Each empire has as many votes as population. The two empires with the most votes are the candidates; the others vote for the one they trust more, and abstain when they trust neither at least {4}. Whoever gets {3} % of all votes is elected and wins. A loser may refuse to submit, once per game; then everyone who voted for the winner goes to war with the refuser.
rules.article.council.deviation=The first session on turn {0}, the period of {1} turns and the minimum of {2} empires belong to this game: without them two thirds came by themselves in a small game and ended it on turn 25.
rules.article.growth.title=Colonists
rules.article.growth.text=Each colonist eats {0} food per turn. A farmer grows food, a worker makes production, a scientist gives {1} research points before bonuses; every colonist pays {2} gc of tax. Population grows faster the more free room the planet has; hunger makes colonists die instead. Buildings, race and morale add to all of this.
rules.article.pollution.title=Pollution
rules.article.pollution.text=Industry pollutes. From what a colony extracts, the clean part is subtracted (fixed production of buildings and recycling); the rest is divided by the cleaning buildings, the tolerance of the planet is subtracted, and half of what remains goes to cleaning up. Example: extraction {0}, of it {1} clean, a medium planet (tolerance {2}) and a waste processor (divisor {3}): {4} goes to cleanup and {5} stays useful.
rules.article.buying.title=Buying and selling
rules.article.buying.text=Any project except housing and trade goods can be bought: the missing production costs {0} gc a unit until half is built and {1} gc a unit after that, so finishing an almost built project is cheapest. A building can be sold, one per colony per turn: the treasury gets 1/{2} of its price.
rules.article.buying.deviation=A sold building also gives the colony the same 1/{2} of its price as production for the next project: in the original selling gave only money.
rules.article.battle.title=Battle
rules.article.battle.text=A tactical battle is fought on a field of {0} by {1} cells; ships move in order of initiative. The chance to hit follows a curve: every {2} points of attack over the target defence double the odds. A beam loses {3} % of its damage every {4} cells, never below {5} %; projectiles and missiles hit at full force, and missiles fly and can be shot down. A hit through shield and armour knocks out a ship system {6} % of the time, and a destroyed engine explodes in {7} % of cases, hitting its neighbours.
rules.article.ground.title=Ground combat
rules.article.ground.text=Each soldier gives {0} strength, raised by percentages that add up: race, officer, researched rifles, armour, equipment and battloids, and for the defender also barracks. The stronger side takes the planet. No landing while the orbital defence or a barrier shield still stands.
rules.article.trust.title=Trust and talks
rules.article.trust.text=Trust runs from 0 to 100, and every empire keeps its own opinion of you. Meeting starts at {0}. A signed agreement adds {1}, a broken treaty takes {2}, a declared war {3}. A rival makes peace only when its trust in you is at least {4}; a technology trade is accepted when it gets no less than it gives, and a gift needs no consent.
rules.article.command.title=Command points
rules.article.command.text=Ships use command points by hull size; each colony gives {0} points, warlords twice as many. Every point over the limit costs {1} gc of income per turn.

