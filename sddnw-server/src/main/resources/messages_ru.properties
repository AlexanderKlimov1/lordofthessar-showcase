rules.article.luck.title=Случай и правило
rules.article.luck.text=Жребий решает попадание в бою, взрывы гибнущих кораблей, прорыв в науке и галактические события; сила, технологии и числа в итогах хода — правило, а не удача. Галактические события не ровные: беды находят сильнейшую империю в {0} раза чаще, чем слабейшую, а удачи — наоборот.
rules.article.luck.deviation=Попадание в бою не идёт длинными полосами промахов: после каждого промаха шанс следующего выстрела растёт, попадание его сбрасывает, а в среднем шанс — тот, что показан.
