chapter.NEIGHBOURS.goal=В галактике есть кто-то ещё: теперь открыты переговоры, обмен и договоры.
chapter.WAR.goal=Заговорили пушки: стоит удержать колонии и бить там, где у врага тонко.
chapter.COUNCIL.goal=Высший совет близко: голоса там по населению, а друзья голосуют за друзей.
chapter.FINALE.goal=Кто-то близок к победе: теперь на счету каждый ход.
