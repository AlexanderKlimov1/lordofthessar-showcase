# Lord of Thessar (Владыка Тессара) — тексты сервера по-русски. Английский (он же запасной для любого
# другого языка) — в messages.properties; наборы ключей обоих файлов должны совпадать.
#
# Каждое значение проходит через java.text.MessageFormat (always-use-message-format):
#   - апостроф в тексте пишется удвоенным: ''
#   - {0}, {1}… — подстановки; фигурная скобка в тексте берётся в апострофы: '{'
# Ключи сгруппированы по подсистемам; сервисы бросают исключение с ключом отсюда, а
# GlobalExceptionHandler переводит его на язык заголовка Accept-Language.

