# Справочник «Как устроено» — field-backlog, пункты 75 и 200 (RulesBookService).
rules.phase.PopulationPhase.title=Рост населения
rules.phase.PopulationPhase.text=Колонии растут по свободному месту и еде или голодают; дома добавляют жителей.
rules.phase.TransferPhase.title=Прибытие жителей
rules.phase.TransferPhase.text=Жители, которых везли между системами, высаживаются в новой колонии.
rules.phase.ProductionPhase.title=Производство и доход
rules.phase.ProductionPhase.text=Колонии достраивают здания и корабли, начинается следующее дело очереди, приходят налоги и уходит содержание. Построенный сейчас корабль уже в своём флоте и может встретить врага в этот же ход.
rules.phase.AiEmpirePhase.title=Решения соседей
rules.phase.AiEmpirePhase.text=Империи ИИ — и империи ушедших игроков — выбирают стройку, шлют флоты и агентов.
rules.phase.LeaderPhase.title=Лидеры
rules.phase.LeaderPhase.text=Лидеры предлагают службу, набираются опыта и получают жалованье.
rules.phase.ResearchPhase.title=Наука
rules.phase.ResearchPhase.text=Очки исследований прибавляются, и проверяется прорыв. Наука идёт после производства: найденная сейчас технология служит стройке со следующего хода.
rules.phase.AssimilationPhase.title=Ассимиляция
rules.phase.AssimilationPhase.text=Подданные захваченной колонии понемногу становятся своими.
rules.phase.EspionagePhase.title=Разведка
rules.phase.EspionagePhase.text=Агенты выполняют задания, контрразведка ловит чужих шпионов.
rules.phase.ArrivalPhase.title=Прибытие флотов
rules.phase.ArrivalPhase.text=Флоты доходят до своих звёзд и разведывают системы, встречают мины и чудищ; колониальные корабли готовы к высадке.
rules.phase.EncounterPhase.title=Встречи и бои
rules.phase.EncounterPhase.text=Флоты у одной звезды встречаются, и идут бои — быстрым расчётом или на тактическом поле.
rules.phase.ContactPhase.title=Знакомства
rules.phase.ContactPhase.text=Империи, которые достают друг до друга, знакомятся; знакомство замирает, когда не достаёт никто.
rules.phase.GalacticEventsPhase.title=События
rules.phase.GalacticEventsPhase.text=Случайные события — находки, аварии, пираты, — если они включены в партии.
rules.phase.AiDiplomacyPhase.title=Дипломатия соседей
rules.phase.AiDiplomacyPhase.text=Предложения людям решаются их ответами (без ответа — доверием); затем империи ИИ объявляют войну, просят мира, предлагают договоры и требуют дань.
rules.phase.ArtifactChoicePhase.title=Наследие ушедших
rules.phase.ArtifactChoicePhase.text=Наследие, не выбранное до конца следующего хода, отдаёт первые по жребию технологии
rules.phase.EmpireHistoryPhase.title=Летопись
rules.phase.EmpireHistoryPhase.text=Население, флот, выработка и наука каждой империи записываются для графиков «Инфо».
rules.phase.VictoryPhase.title=Победа
rules.phase.VictoryPhase.text=Проверяются пути к победе: покорение, совет, Тессар, могущество.
rules.phase.IntelPhase.title=Память о чужих колониях
rules.phase.IntelPhase.text=Увиденное сейчас запоминается: без глаз чужая колония остаётся такой, какой вы её застали.
rules.phase.ChapterPhase.title=Главы партии
rules.phase.ChapterPhase.text=Партия делится на главы по своему состоянию, а не по номеру хода: расселение, первые соседи, первая война, борьба за совет и финал. Новая глава называется в итогах хода.
rules.article.victory.title=Пути к победе
rules.article.victory.text=Их четыре. Покорение: колонии остались только у вас. Высший совет: избранному нужно {0} % всех голосов. Удержание Тессара: одна империя держит колонию у особой звезды {1} ходов подряд. Итог по могуществу: если к {2}-му ходу партия не кончилась ничем другим, побеждает сильнейшая живая империя. Какие пути включены, решают при создании партии.
rules.article.victory.deviation=Удержание Тессара и итог по могуществу — пути этой игры: они дают долгой партии финишную черту.
rules.article.council.title=Высший совет
rules.article.council.text=Совет собирается не раньше {0}-го хода и дальше раз в {1} ходов, пока живы хотя бы {2} империи. Голосов у империи столько, сколько населения. Кандидатов двое — сильнейшие по голосам; прочие голосуют за того, кому доверяют больше, и воздерживаются, если ни одному не доверяют хотя бы на {4}. Набравший {3} % всех голосов избран и побеждает. Проигравший вправе не подчиниться — один раз за партию; тогда все, кто голосовал за избранного, идут на отказника войной.
rules.article.council.deviation=Первый созыв на {0}-м ходу, срок в {1} ходов и не меньше {2} империй — правила этой игры: без них две трети в малой партии набирались сами и обрывали её на 25-м ходу.
rules.article.growth.title=Жители
rules.article.growth.text=Каждый житель съедает {0} еды за ход. Фермер растит еду, рабочий даёт производство, учёный — {1} очка исследований до прибавок; налога с жителя — {2} gc. Чем больше свободного места на планете, тем быстрее растёт население, а голод вместо роста уносит жителей. Ко всему этому прибавляют здания, раса и мораль.
rules.article.pollution.title=Загрязнение
rules.article.pollution.text=Промышленность пачкает. Из добытого колонией вычитается чистая часть (твёрдое производство зданий и переработка); остаток делится очистными сооружениями, из него вычитается терпимость планеты, и половина остатка уходит на уборку. Пример: добыто {0}, из них {1} чистых, средняя планета (терпимость {2}) и переработчик отходов (делитель {3}): {4} уходит на уборку, {5} остаётся колонии.
rules.article.buying.title=Выкуп и продажа
rules.article.buying.text=Любую стройку, кроме домов и товаров, можно выкупить: недостающее производство стоит {0} gc за единицу, пока не построена половина, и {1} gc после неё, поэтому дешевле всего дотолкнуть почти готовое. Здание можно продать, одно в колонии за ход: казна получает 1/{2} его цены.
rules.article.buying.deviation=Проданное здание вдобавок отдаёт колонии те же 1/{2} цены производством в следующую стройку: в оригинале продажа давала только деньги.
rules.article.battle.title=Бой
rules.article.battle.text=Тактический бой идёт на поле {0} на {1} клеток, корабли ходят по инициативе. Шанс попадания идёт кривой: каждые {2} очка атаки сверх защиты цели удваивают шансы. Луч теряет {3} % урона каждые {4} клетки, но не меньше {5} %; снаряды и ракеты бьют в полную силу, а ракеты летят, и их можно сбить. Попадание сквозь щит и броню в {6} % случаев выбивает систему корабля, а разбитый двигатель в {7} % случаев взрывается и бьёт соседей.
rules.article.ground.title=Наземный бой
rules.article.ground.text=Каждый боец даёт {0} силы, и её поднимают проценты, которые складываются: раса, офицер, изученные винтовки, броня, снаряжение и батлоиды, а у обороняющегося ещё казармы. Планету берёт сильнейшая сторона. Высадки нет, пока цела оборона на орбите или барьерный щит.
rules.article.trust.title=Доверие и переговоры
rules.article.trust.text=Доверие — от 0 до 100, и у каждой империи своё мнение о вас. Знакомство начинается с {0}. Подписанное соглашение прибавляет {1}, расторгнутый договор отнимает {2}, объявленная война — {3}. Мир сосед заключает, только если доверяет вам хотя бы на {4}; обмен технологиями принимает, когда получает не меньше, чем отдаёт, а подарку согласия не нужно.
rules.article.command.title=Командные очки
rules.article.command.text=Корабли тратят командные очки по величине корпуса; каждая колония даёт {0} очка, военачальникам вдвое больше. Каждое очко сверх запаса стоит {1} gc дохода за ход.

# Речь посла по характеру правителя — field-backlog, пункт 139 (DiplomacyService.speech).
envoy.say=«{0}» {1}
envoy.withMemory={0} {1}
envoy.memory.war=И мы помним: на {0}-м ходу вы объявили нам войну.
envoy.memory.broken=И мы помним: на {0}-м ходу вы разорвали с нами {1}.
milestone.youDeclaredWar=Вы объявили войну империи {0}
milestone.youBrokeTreaty=Вы разорвали {1} с империей {0}
envoy.RUTHLESS.war=Да будет так. Ваши миры сгорят первыми.
envoy.RUTHLESS.peace=Пока — мир. Не путайте его с милостью.
envoy.RUTHLESS.treaty=Согласны. Посмотрим, как вы его сдержите.
envoy.RUTHLESS.broken=Разорван. Иного мы от вас и не ждали.
envoy.RUTHLESS.tribute=Берите. Мы запомним каждую монету.
envoy.RUTHLESS.exchange=Честный обмен. На этот раз.
envoy.RUTHLESS.gift=Принимаем. Это ничего не меняет.
envoy.RUTHLESS.refusal=Нет. И не спрашивайте снова.
envoy.AGGRESSIVE.war=Наконец-то! Наши флоты давно этого ждали.
envoy.AGGRESSIVE.peace=Ладно. А мы тем временем перевооружимся.
envoy.AGGRESSIVE.treaty=Подписано. Не заставьте нас пожалеть.
envoy.AGGRESSIVE.broken=Вы нарушили слово. Мы разобьём ваши флоты.
envoy.AGGRESSIVE.tribute=Забирайте свои монеты, и подавитесь ими.
envoy.AGGRESSIVE.exchange=Сделано. А теперь прочь с глаз.
envoy.AGGRESSIVE.gift=Хм. Подкуп? Возьмём.
envoy.AGGRESSIVE.refusal=Вы тратите наше время.
envoy.ERRATIC.war=Война? А почему бы и нет! Становилось скучно.
envoy.ERRATIC.peace=Мир! Сегодня вы нам, кажется, нравитесь.
envoy.ERRATIC.treaty=Да-да, подпишем, пока мы не передумали.
envoy.ERRATIC.broken=Разорвали? Забавно. Посмотрим, что из этого выйдет.
envoy.ERRATIC.tribute=Вот, берите. Завтра, может, захотим обратно.
envoy.ERRATIC.exchange=Обмен! Какая любопытная мысль. Согласны.
envoy.ERRATIC.gift=Подарок! Как неожиданно. Мы в восторге — пока.
envoy.ERRATIC.refusal=Нет. Спросите завтра, может быть.
envoy.XENOPHOBIC.war=Мы так и знали. Чужаки всегда несут войну.
envoy.XENOPHOBIC.peace=Мир. Держите корабли подальше от наших звёзд.
envoy.XENOPHOBIC.treaty=Подписано — на расстоянии. Оставайтесь на своей стороне.
envoy.XENOPHOBIC.broken=Как мы и говорили: чужакам верить нельзя.
envoy.XENOPHOBIC.tribute=Берите и покиньте наше пространство.
envoy.XENOPHOBIC.exchange=Обмен сделан. Теперь уходите.
envoy.XENOPHOBIC.gift=Подарок мы принимаем. Ваше общество нам не нужно.
envoy.XENOPHOBIC.refusal=Нам ничего не нужно от чужаков.
envoy.HONORABLE.war=Вы выбрали войну. Мы встретим вас с честью.
envoy.HONORABLE.peace=Мир мы принимаем с радостью — и сдержим его.
envoy.HONORABLE.treaty=Наше слово дано. Пусть ваше будет столь же твёрдым.
envoy.HONORABLE.broken=Разорванный договор — пятно, которое не смыть.
envoy.HONORABLE.tribute=Мы платим, что просят, и помним это с достоинством.
envoy.HONORABLE.exchange=Честный обмен между честными народами.
envoy.HONORABLE.gift=Ваша щедрость делает нам честь.
envoy.HONORABLE.refusal=При всём уважении, наш народ на это не согласится.
envoy.PACIFISTIC.war=Война? Мы скорбим. И всё ещё надеемся на мир.
envoy.PACIFISTIC.peace=Мир! Наш народ ликует.
envoy.PACIFISTIC.treaty=С радостью. Пусть он сблизит наши народы.
envoy.PACIFISTIC.broken=Это глубоко нас печалит. Наша дверь открыта.
envoy.PACIFISTIC.tribute=Если это сохранит мир — берите.
envoy.PACIFISTIC.exchange=Знание, которым поделились, удваивается.
envoy.PACIFISTIC.gift=Спасибо, друг. Мы этого не забудем.
envoy.PACIFISTIC.refusal=Простите, сейчас мы не можем на это согласиться.

